name: Sprechhilfe bauen (Windows-EXE)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller==6.15.0
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Sprechhilfe.exe bauen
        run: python -m PyInstaller --noconfirm sprechhilfe.spec
      - name: Selbsttest beider EXE (lädt das kleinste Modell und erkennt Stille)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\Sprechhilfe\Sprechhilfe.exe", "dist\Sprechhilfe-EinKlick.exe")) {
            Remove-Item "$env:APPDATA\Sprechhilfe\selbsttest.txt" -ErrorAction SilentlyContinue
            $test = Start-Process $exe -ArgumentList "--selbsttest" -Wait -PassThru
            Write-Host "$exe :"
            Get-Content "$env:APPDATA\Sprechhilfe\selbsttest.txt"
            if ($test.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen: $exe" }
          }
      - name: Installer bauen (Sprechhilfe-Setup.exe)
        shell: pwsh
        env:
          SPRECHHILFE_VERSION: 1.0.${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }
          Compress-Archive -Path dist\Sprechhilfe -DestinationPath Sprechhilfe-Windows-portable.zip
          Copy-Item Output\Sprechhilfe-Setup.exe Sprechhilfe-Setup.exe
          Copy-Item dist\Sprechhilfe-EinKlick.exe Sprechhilfe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Sprechhilfe-Windows
          path: |
            Sprechhilfe.exe
            Sprechhilfe-Setup.exe
            Sprechhilfe-Windows-portable.zip

  release:
    name: Download-Seite (GitHub Release)
    needs: [windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sprechhilfe-${{ github.run_number }}
          name: Sprechhilfe ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Mit einem Klick:** `Sprechhilfe.exe` herunterladen und doppelklicken. Fertig. Sie läuft unsichtbar im Hintergrund, nur ein Mikrofon-Symbol unten rechts in der Taskleiste (eventuell hinter dem Pfeil ^).

            Im Spiel: **F8** oder die vordere Seitentaste der Maus gedrückt halten, Deutsch sprechen, loslassen. Der Text wird ins Spiel getippt und abgeschickt.

            Beim allerersten Start wird die Spracherkennung einmalig heruntergeladen (ca. 460 MB). Danach läuft alles offline auf deinem PC.
            Wichtig: Im Spiel die eigene Sprachaufnahme ausschalten bzw. auf Tippen stellen, sonst kommt alles doppelt an.

            Alternativ: `Sprechhilfe-Setup.exe` (mit Startmenü und Autostart) oder `Sprechhilfe-Windows-portable.zip`.
            Windows SmartScreen fragt evtl. beim ersten Start: „Weitere Informationen“ → „Trotzdem ausführen“.
          files: |
            out/Sprechhilfe.exe
            out/Sprechhilfe-Setup.exe
            out/Sprechhilfe-Windows-portable.zip
